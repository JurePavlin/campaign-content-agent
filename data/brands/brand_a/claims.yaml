# SYNTHETIC: Moien Vëlo is a fictional brand. Evidence references marked "synthetic"
# point to documents that don't exist; they stand in for the real evidence a company would hold.
#
# The approved claims register. A draft may only make a claim that is listed here with
# status "approved" and is valid on the publication date. Claims with status
# "not_substantiated" are listed so the claims check can recognise and block them.
#
# Fields:
#   status       approved | not_substantiated
#   category     safety | performance | product | health | environmental | service | offer | legal | reputation
#   products     product ids from catalogue.yaml, or [all]
#   valid_from / valid_until   inclusive dates; null means no limit
