[project]
name = "campaign-content-agent"
version = "0.1.0"
description = "A LangGraph agent that turns a campaign brief into an approved, on-brand, claim-checked content pack."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jure Pavlin" }]
requires-python = ">=3.13"
dependencies = [
    "langchain-openai>=1.7.3",
    "langchain-postgres>=0.0.19",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "textstat>=0.7.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls Azure OpenAI or Postgres"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
