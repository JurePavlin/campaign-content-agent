# Postgres with pgvector: LangGraph checkpoints and memory, the claims register and the exemplar index.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: campaign_agent
    ports:
      - "127.0.0.1:5432:5432"  # reachable from this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d campaign_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
